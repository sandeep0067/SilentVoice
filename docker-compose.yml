version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ML_MODEL_PATH=/app/ml/models/v1.0.0/model.pth
    volumes:
      - ./ml/models:/app/ml/models
      - ./translation/data:/app/translation/data
